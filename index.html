<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satellite Mobile Tracker v3.1 🔒</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Satellite <span>Tracker</span> 🛰️</h1>
        <p>Masukkan Nomor HP Target untuk Melacak Posisi Real-time</p>
        
        <div class="input-group">
            <input type="number" id="phone" placeholder="Contoh: 0812xxxxxx">
            <button onclick="startTracking()">LACAK SEKARANG!</button>
        </div>

        <div id="status">Status: Ready to Seek... 😈</div>
        <div id="result" class="hidden"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
